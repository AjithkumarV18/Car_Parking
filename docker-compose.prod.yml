services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    env_file: .env.production
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./deployment/mongo-init.sh:/docker-entrypoint-initdb.d/20-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [parking-internal]

  backend:
    image: ${BACKEND_IMAGE:-parking-backend:local}
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_INITDB_DATABASE}?authSource=${MONGO_INITDB_DATABASE}
      MONGODB_DATABASE: ${MONGO_INITDB_DATABASE}
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [parking-internal]

  frontend:
    image: ${FRONTEND_IMAGE:-parking-frontend:local}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    networks: [parking-internal]

  nginx:
    image: ${NGINX_IMAGE:-parking-nginx:local}
    build:
      context: .
      dockerfile: deployment/nginx/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CERTBOT_CERTS_DIR:-./certbot/conf}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT_DIR:-./certbot/www}:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks: [parking-internal]

volumes:
  mongo-data:

networks:
  parking-internal:
    driver: bridge
