[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-management-api"
version = "0.1.0"
description = "Commercial vehicle parking management API foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "motor>=3.6,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "email-validator>=2.2,<3.0",
  "reportlab>=4.2,<5.0",
  "tzdata>=2025.1,<2027.0",
  "python-json-logger>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP046", "UP047"] # FastAPI dependency defaults and Pydantic generic style.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a dedicated MongoDB integration-test database and RUN_INTEGRATION_TESTS=1",
]
