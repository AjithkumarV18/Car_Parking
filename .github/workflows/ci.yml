name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend lint and unit tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check app tests
          python -m pytest -m "not integration"
      - name: Frontend lint and production build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Validate Docker build contexts
        run: |
          docker build -t parking-backend:ci ./backend
          docker build -t parking-frontend:ci ./frontend --build-arg VITE_API_BASE_URL=/api/v1
          docker build -t parking-nginx:ci -f deployment/nginx/Dockerfile .

  integration:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_INTEGRATION_TESTS: "1"
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: parking_integration_test
      ENVIRONMENT: test
      DEBUG: "false"
      DOCS_ENABLED: "true"
      JWT_SECRET_KEY: integration-test-secret-must-be-long-enough
      BACKEND_CORS_ORIGINS: http://testserver
      ALLOWED_HOSTS: testserver,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Run Mongo-backed API integration tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -m integration
